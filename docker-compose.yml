services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex_dev_password
      POSTGRES_DB: apex_ux
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_ux"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  apex-app:
    build: .
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://apex:apex_dev_password@postgres:5432/apex_ux
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PLANNER_BACKEND: ${PLANNER_BACKEND:-openai}
      UTILITY_BACKEND: ${UTILITY_BACKEND:-openai}
      PLANNER_SERVICE_URL: ${PLANNER_SERVICE_URL:-http://host.docker.internal:8001}
      GROUNDING_SERVICE_URL: ${GROUNDING_SERVICE_URL:-http://host.docker.internal:8000}
      SCREENSHOT_STORAGE_TYPE: ${SCREENSHOT_STORAGE_TYPE:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-storage/screenshots}
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      # Uncomment when S3 ready:
      # S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      # S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      # S3_SECRET_KEY: ${S3_SECRET_KEY}
      # S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # S3_REGION: ${S3_REGION:-eu-central-1}
      # S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8002 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  postgres_data: