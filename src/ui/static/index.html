<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX-UX</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'page-gray':         '#F8F8FA',
                        'border-gray':       '#E4E4EC',
                        'muted-gray':        '#8A8A9A',
                        'body-dark':         '#2C2C3A',
                        'hover-gray':        '#f3f3fa',
                        'brand-navy':        '#090947',
                        'brand-blue':        '#0A66FF',
                        'brand-blue-dark':   '#0050cc',
                        'success-green':     '#24C875',
                        'success-dark':      '#0a3d22',
                        'error-red':         '#FF4D4D',
                        'error-light':       '#ffe0e0',
                        'error-dark':        '#8b0000',
                        'warn-yellow':       '#F3E988',
                        'warn-yellow-dark':  '#5a4a00',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <style>
        .ibm-mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
</head>
<body class="bg-page-gray text-body-dark min-h-screen">

    <header class="bg-white border-b border-border-gray px-8 h-[58px] flex items-center">
        <a href="/" class="text-[2rem] font-bold text-brand-navy tracking-[0.05em] uppercase no-underline">
            APEX<span class="text-brand-blue">-UX</span>
        </a>
    </header>

    <main class="max-w-[1600px] mx-auto px-8 py-8">
        <div hx-get="/partials/evaluations"
             hx-trigger="load"
             hx-swap="outerHTML"
             hx-on::response-error="this.textContent='Failed to load evaluations. Please refresh the page.'">
            <div class="text-center py-16 text-muted-gray">
                <div class="w-7 h-7 border-2 border-border-gray border-t-brand-blue rounded-full animate-spin mx-auto mb-4"></div>
                <p>Loading evaluations...</p>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu(btn) {
            const dropdown = btn.nextElementSibling;
            const isOpen = !dropdown.classList.contains('hidden');
            document.querySelectorAll('.dropdown').forEach(d => d.classList.add('hidden'));
            if (!isOpen) {
                dropdown.classList.remove('hidden');
                const b = btn.getBoundingClientRect();
                const d = dropdown.getBoundingClientRect();
                dropdown.style.top  = (b.bottom + 4) + 'px';
                dropdown.style.left = (b.right - d.width) + 'px';
            }
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown-wrap')) {
                document.querySelectorAll('.dropdown').forEach(d => d.classList.add('hidden'));
            }
        });
    </script>
</body>
</html>
