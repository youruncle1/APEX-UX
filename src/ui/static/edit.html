<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Evaluation - APEX-UX</title>
    <link rel="icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex items-center space-x-4">
                <a href="/" class="text-gray-600 hover:text-gray-900">
                    ← Back
                </a>
                <h1 class="text-2xl font-bold text-gray-900">Edit Evaluation</h1>
                <span class="px-2 py-1 text-xs font-medium rounded-full bg-amber-100 text-amber-800">
                    Editing Mode
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-gray-600">Loading evaluation...</p>
        </div>

        <form id="evaluation-form" class="hidden space-y-8">
            <!-- Evaluation Details -->
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Evaluation Details</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Evaluation Name (optional)</label>
                        <input type="text" id="eval-name" 
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                               placeholder="E.g., E-commerce Usability Test">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Website Base URL *</label>
                        <input type="url" id="eval-url" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                               placeholder="https://example.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Number of Clones</label>
                        <input type="number" id="clone-count" value="3" min="1" max="10"
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <p class="mt-1 text-sm text-gray-500">Number of persona clones to simulate</p>
                    </div>
                </div>
            </div>

            <!-- Tasks Section -->
            <div class="bg-white shadow rounded-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-900">Tasks</h2>
                    <button type="button" onclick="addTask()" 
                            class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">
                        + Add Task
                    </button>
                </div>

                <div id="tasks-container" class="space-y-4">
                    <!-- Task cards will be added here -->
                </div>

                <p id="no-tasks-message" class="text-sm text-gray-500 text-center py-8">
                    No tasks added yet. Click "Add Task" to create a task.
                </p>
            </div>

            <!-- Submit -->
            <div class="flex justify-end space-x-4">
                <a href="/" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit" id="submit-btn"
                        class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
                    Save Changes
                </button>
            </div>
        </form>
    </main>

    <script>
        const API_BASE = '';
        const evaluationId = window.location.pathname.split('/')[2];
        let taskIdCounter = 0;
        let verifyRuleCounter = 0;

        document.addEventListener('DOMContentLoaded', loadEvaluation);

        async function loadEvaluation() {
            try {
                const response = await fetch(`${API_BASE}/api/evaluation/${evaluationId}/editable`);
                
                if (!response.ok) {
                    throw new Error('Cannot edit this evaluation');
                }
                
                const data = await response.json();

                // Hide loading, show form
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('evaluation-form').classList.remove('hidden');

                // Pre-fill form
                document.getElementById('eval-name').value = data.name || '';
                document.getElementById('eval-url').value = data.base_url;
                document.getElementById('clone-count').value = data.clone_count;

                // Load tasks
                data.tasks.forEach(task => {
                    addTask(task);
                });

                // If no tasks, show message
                if (data.tasks.length === 0) {
                    document.getElementById('no-tasks-message').classList.remove('hidden');
                } else {
                    document.getElementById('no-tasks-message').classList.add('hidden');
                }

            } catch (error) {
                console.error('Failed to load evaluation:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="text-center">
                        <p class="text-red-600 mb-4">Failed to load evaluation. ${error.message}</p>
                        <a href="/" class="text-blue-600 hover:underline">← Back to Dashboard</a>
                    </div>
                `;
            }
        }

        function addTask(taskData = null) {
            const taskId = taskIdCounter++;
            const container = document.getElementById('tasks-container');
            const noTasksMsg = document.getElementById('no-tasks-message');

            noTasksMsg.classList.add('hidden');

            const taskCard = document.createElement('div');
            taskCard.id = `task-${taskId}`;
            taskCard.className = 'border border-gray-200 rounded-lg p-4';

            const description = taskData ? taskData.description : '';
            const maxSteps = taskData ? taskData.max_steps : 25;
            const urlOverride = taskData ? (taskData.base_url_override || '') : '';
            const hasVerification = taskData && taskData.verification_rules;

            taskCard.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <h3 class="text-sm font-medium text-gray-900">Task ${taskIdCounter}</h3>
                    <button type="button" onclick="removeTask(${taskId})" 
                            class="text-red-600 hover:text-red-800 text-sm">
                        Remove
                    </button>
                </div>

                <!-- Simple View (Default) -->
                <div id="simple-${taskId}" class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Task Description *</label>
                        <textarea id="desc-${taskId}" required rows="2"
                                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                                  placeholder="E.g., Add a blue wireless mouse to the shopping cart">${description}</textarea>
                    </div>

                    <button type="button" onclick="toggleAdvanced(${taskId})" 
                            class="text-sm text-blue-600 hover:text-blue-800">
                        ⚙️ Advanced Options
                    </button>
                </div>

                <!-- Advanced View (Hidden by default) -->
                <div id="advanced-${taskId}" class="hidden space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Task Description *</label>
                        <textarea id="desc-adv-${taskId}" required rows="2"
                                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                                  placeholder="E.g., Add a blue wireless mouse to the shopping cart">${description}</textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Max Steps</label>
                            <input type="number" id="max-steps-${taskId}" value="${maxSteps}" min="5" max="100"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Base URL Override</label>
                            <input type="url" id="url-override-${taskId}" value="${urlOverride}"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                                   placeholder="https://...">
                        </div>
                    </div>

                    <!-- Verification UI -->
                    <div>
                        <div class="flex items-center space-x-2 mb-3">
                            <input type="checkbox" id="verify-enabled-${taskId}" 
                                   ${hasVerification ? 'checked' : ''}
                                   class="rounded border-gray-300"
                                   onchange="toggleVerification(${taskId})">
                            <label for="verify-enabled-${taskId}" class="text-sm font-medium text-gray-700">
                                Verify task completion automatically
                            </label>
                        </div>

                        <div id="verify-options-${taskId}" class="${hasVerification ? '' : 'hidden'} pl-6 border-l-2 border-blue-200 space-y-3">
                            <!-- Verification Logic Toggle -->
                            <div class="bg-blue-50 rounded p-3">
                                <div class="text-xs font-medium text-gray-700 mb-2">How should verification work?</div>
                                <label class="flex items-center space-x-2 mb-2">
                                    <input type="radio" name="verify-logic-${taskId}" value="any_of" checked
                                           class="border-gray-300">
                                    <span class="text-sm">ANY one of these rules passes (OR logic)</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="radio" name="verify-logic-${taskId}" value="all_of"
                                           class="border-gray-300">
                                    <span class="text-sm">ALL of these rules must pass (AND logic)</span>
                                </label>
                            </div>

                            <!-- Rules Container -->
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-sm font-medium text-gray-700">Verification Rules:</span>
                                    <button type="button" onclick="addVerifyRule(${taskId})"
                                            class="text-xs text-blue-600 hover:text-blue-800 font-medium">
                                        + Add rule
                                    </button>
                                </div>
                                <div id="verify-rules-${taskId}" class="space-y-2">
                                    <!-- Rules will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="toggleAdvanced(${taskId})" 
                            class="text-sm text-blue-600 hover:text-blue-800">
                        ← Simple View
                    </button>
                </div>
            `;

            container.appendChild(taskCard);
            
            // Populate verification rules if they exist
            if (hasVerification && taskData.verification_rules) {
                populateVerificationRules(taskId, taskData.verification_rules);
            }
        }

        function populateVerificationRules(taskId, rules) {
            if (!rules) return;
            
            // Detect if this is advanced mode (has all_of with any_of children or mixed types)
            const isAdvanced = detectAdvancedMode(rules);
            
            if (isAdvanced) {
                // Switch to advanced mode
                verifyModes[taskId] = 'advanced';
                document.getElementById(`verify-simple-${taskId}`).classList.add('hidden');
                document.getElementById(`verify-advanced-${taskId}`).classList.remove('hidden');
                document.getElementById(`verify-mode-btn-${taskId}`).textContent = '← Switch to Simple Mode';
                
                populateAdvancedRules(taskId, rules);
            } else {
                // Simple mode
                populateSimpleRules(taskId, rules);
            }
        }

        function detectAdvancedMode(rules) {
            // Advanced if top-level is all_of with mixed children (any_of groups + regular rules)
            if (rules.type === 'all_of' && rules.conditions) {
                const hasAnyOf = rules.conditions.some(c => c.type === 'any_of');
                const hasRegular = rules.conditions.some(c => c.type !== 'any_of');
                return hasAnyOf; // If any OR groups exist, it's advanced
            }
            return false;
        }

        function populateSimpleRules(taskId, rules) {
            let logic = 'any_of';
            let conditions = [];
            
            if (rules.type === 'any_of' || rules.type === 'all_of') {
                logic = rules.type;
                conditions = rules.conditions || [];
            } else {
                // Single rule
                conditions = [rules];
            }
            
            // Set logic radio button
            const logicRadio = document.querySelector(`input[name="verify-logic-${taskId}"][value="${logic}"]`);
            if (logicRadio) logicRadio.checked = true;
            
            // Add each condition as a rule
            conditions.forEach(condition => {
                addVerifyRule(taskId);
                
                const rulesContainer = document.getElementById(`verify-rules-${taskId}`);
                const lastRule = rulesContainer.lastElementChild;
                if (!lastRule) return;
                
                const ruleId = lastRule.id.split('-').pop();
                const typeSelect = document.getElementById(`verify-rule-type-${taskId}-${ruleId}`);
                const valueInput = document.getElementById(`verify-rule-value-${taskId}-${ruleId}`);
                
                if (condition.type === 'url_contains') {
                    typeSelect.value = 'url_contains';
                    valueInput.value = condition.value || '';
                } else if (condition.type === 'text_any') {
                    typeSelect.value = 'text_any';
                    valueInput.value = (condition.texts && condition.texts[0]) || '';
                }
            });
        }

        function populateAdvancedRules(taskId, rules) {
            if (rules.type !== 'all_of' || !rules.conditions) return;
            
            advancedGroupCounter[taskId] = 1;
            
            rules.conditions.forEach(condition => {
                if (condition.type === 'any_of') {
                    // This is an OR group
                    const groupId = advancedGroupCounter[taskId]++;
                    const groupsContainer = document.getElementById(`verify-advanced-groups-${taskId}`);
                    
                    // Create group manually to set name
                    const groupDiv = document.createElement('div');
                    groupDiv.id = `verify-advanced-group-${taskId}-${groupId}`;
                    groupDiv.className = 'border-2 border-blue-200 rounded-lg p-3 bg-blue-50';
                    
                    const groupName = condition.name || `Group ${groupId}`;
                    
                    groupDiv.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <input type="text" id="verify-advanced-group-name-${taskId}-${groupId}"
                                value="${groupName}"
                                class="text-sm font-medium border-gray-300 rounded px-2 py-1 bg-white"
                                placeholder="Group name">
                            <button type="button" onclick="removeAdvancedORGroup(${taskId}, ${groupId})"
                                    class="text-red-600 hover:text-red-800 text-sm font-medium">
                                Remove Group
                            </button>
                        </div>
                        
                        <div class="text-xs text-gray-600 mb-2">ANY of these rules must pass:</div>
                        
                        <div id="verify-advanced-group-rules-${taskId}-${groupId}" class="space-y-2 mb-2">
                        </div>
                        
                        <button type="button" onclick="addAdvancedGroupRule(${taskId}, ${groupId})"
                                class="text-xs text-blue-600 hover:text-blue-800 font-medium">
                            + Add rule to group
                        </button>
                    `;
                    
                    groupsContainer.appendChild(groupDiv);
                    
                    // Add rules to group
                    advancedGroupRuleCounters[`${taskId}-${groupId}`] = 0;
                    (condition.conditions || []).forEach(rule => {
                        addAdvancedGroupRule(taskId, groupId);
                        
                        const rulesContainer = document.getElementById(`verify-advanced-group-rules-${taskId}-${groupId}`);
                        const lastRule = rulesContainer.lastElementChild;
                        if (!lastRule) return;
                        
                        const ruleId = lastRule.id.split('-').pop();
                        const typeSelect = document.getElementById(`verify-advanced-group-rule-type-${taskId}-${groupId}-${ruleId}`);
                        const valueInput = document.getElementById(`verify-advanced-group-rule-value-${taskId}-${groupId}-${ruleId}`);
                        
                        if (rule.type === 'url_contains') {
                            typeSelect.value = 'url_contains';
                            valueInput.value = rule.value || '';
                        } else if (rule.type === 'text_any') {
                            typeSelect.value = 'text_any';
                            valueInput.value = (rule.texts && rule.texts[0]) || '';
                        }
                    });
                    
                } else {
                    // Individual rule
                    addAdvancedIndividualRule(taskId);
                    
                    const container = document.getElementById(`verify-advanced-individual-${taskId}`);
                    const lastRule = container.lastElementChild;
                    if (!lastRule) return;
                    
                    const ruleId = lastRule.id.split('-').pop();
                    const typeSelect = document.getElementById(`verify-advanced-individual-type-${taskId}-${ruleId}`);
                    const valueInput = document.getElementById(`verify-advanced-individual-value-${taskId}-${ruleId}`);
                    
                    if (condition.type === 'url_contains') {
                        typeSelect.value = 'url_contains';
                        valueInput.value = condition.value || '';
                    } else if (condition.type === 'text_any') {
                        typeSelect.value = 'text_any';
                        valueInput.value = (condition.texts && condition.texts[0]) || '';
                    }
                }
            });
        }

        function removeTask(taskId) {
            const taskCard = document.getElementById(`task-${taskId}`);
            taskCard.remove();

            const container = document.getElementById('tasks-container');
            if (container.children.length === 0) {
                document.getElementById('no-tasks-message').classList.remove('hidden');
            }
        }

        function toggleAdvanced(taskId) {
            const simple = document.getElementById(`simple-${taskId}`);
            const advanced = document.getElementById(`advanced-${taskId}`);

            const descSimple = document.getElementById(`desc-${taskId}`);
            const descAdv = document.getElementById(`desc-adv-${taskId}`);

            if (simple.classList.contains('hidden')) {
                descSimple.value = descAdv.value;
                simple.classList.remove('hidden');
                advanced.classList.add('hidden');
            } else {
                descAdv.value = descSimple.value;
                simple.classList.add('hidden');
                advanced.classList.remove('hidden');
            }
        }

        function toggleVerification(taskId) {
            const enabled = document.getElementById(`verify-enabled-${taskId}`).checked;
            const options = document.getElementById(`verify-options-${taskId}`);
            
            options.classList.toggle('hidden', !enabled);
            
            // Add first rule if enabling and no rules exist
            if (enabled && document.getElementById(`verify-rules-${taskId}`).children.length === 0) {
                addVerifyRule(taskId);
            }
        }

        function addVerifyRule(taskId) {
            const ruleId = verifyRuleCounter++;
            const container = document.getElementById(`verify-rules-${taskId}`);
            
            const ruleDiv = document.createElement('div');
            ruleDiv.id = `verify-rule-${taskId}-${ruleId}`;
            ruleDiv.className = 'flex items-center space-x-2 bg-gray-50 p-2 rounded';
            
            ruleDiv.innerHTML = `
                <select id="verify-rule-type-${taskId}-${ruleId}" 
                        class="text-sm border-gray-300 rounded flex-shrink-0">
                    <option value="url_contains">URL contains</option>
                    <option value="text_any">Page shows text</option>
                </select>
                <input type="text" id="verify-rule-value-${taskId}-${ruleId}"
                       placeholder="Enter value..."
                       class="flex-1 text-sm border-gray-300 rounded">
                <button type="button" onclick="removeVerifyRule(${taskId}, ${ruleId})"
                        class="text-red-600 hover:text-red-800 text-sm px-2">
                    Remove
                </button>
            `;
            
            container.appendChild(ruleDiv);
        }

        function removeVerifyRule(taskId, ruleId) {
            const ruleDiv = document.getElementById(`verify-rule-${taskId}-${ruleId}`);
            if (ruleDiv) {
                ruleDiv.remove();
            }
        }

        function buildVerificationRules(taskId) {
            const enabled = document.getElementById(`verify-enabled-${taskId}`);
            if (!enabled || !enabled.checked) {
                return null;
            }
            
            const rulesContainer = document.getElementById(`verify-rules-${taskId}`);
            if (!rulesContainer || rulesContainer.children.length === 0) {
                return null;
            }
            
            const logic = document.querySelector(`input[name="verify-logic-${taskId}"]:checked`).value;
            const conditions = [];
            
            // Collect all rules
            for (let child of rulesContainer.children) {
                const ruleId = child.id.split('-').pop();
                const typeSelect = document.getElementById(`verify-rule-type-${taskId}-${ruleId}`);
                const valueInput = document.getElementById(`verify-rule-value-${taskId}-${ruleId}`);
                
                if (!typeSelect || !valueInput) continue;
                
                const type = typeSelect.value;
                const value = valueInput.value.trim();
                
                if (!value) continue;
                
                if (type === 'url_contains') {
                    conditions.push({
                        type: 'url_contains',
                        value: value
                    });
                } else if (type === 'text_any') {
                    conditions.push({
                        type: 'text_any',
                        texts: [value]
                    });
                }
            }
            
            if (conditions.length === 0) {
                return null;
            }
            
            // Single rule - return directly
            if (conditions.length === 1) {
                return conditions[0];
            }
            
            // Multiple rules - wrap in logic
            return {
                type: logic,
                conditions: conditions
            };
        }

        // Form submission
        document.getElementById('evaluation-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('eval-name').value.trim() || null;
            const base_url = document.getElementById('eval-url').value.trim();
            const clone_count = parseInt(document.getElementById('clone-count').value);

            if (!base_url) {
                alert('Please enter a base URL');
                return;
            }

            // Gather tasks
            const tasks = [];
            const container = document.getElementById('tasks-container');

            for (let i = 0; i < taskIdCounter; i++) {
                const taskCard = document.getElementById(`task-${i}`);
                if (!taskCard) continue;

                const simple = document.getElementById(`simple-${i}`);
                const isSimpleView = !simple.classList.contains('hidden');

                let description, max_steps, url_override, verify_rules;

                if (isSimpleView) {
                    description = document.getElementById(`desc-${i}`).value.trim();
                    max_steps = 25;
                    url_override = null;
                    verify_rules = null;
                } else {
                    description = document.getElementById(`desc-adv-${i}`).value.trim();
                    max_steps = parseInt(document.getElementById(`max-steps-${i}`).value);
                    url_override = document.getElementById(`url-override-${i}`).value.trim() || null;

                    // Build verification rules
                    verify_rules = buildVerificationRules(i);
                }

                if (!description) {
                    alert(`Task ${i + 1} is missing a description`);
                    return;
                }

                tasks.push({
                    description,
                    max_steps,
                    base_url_override: url_override,
                    verification_rules: verify_rules
                });
            }

            if (tasks.length === 0) {
                alert('Please add at least one task');
                return;
            }

            // Update evaluation
            try {
                const response = await fetch(`${API_BASE}/api/evaluations/${evaluationId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        base_url,
                        clone_count,
                        tasks
                    })
                });

                if (response.ok) {
                    alert('Evaluation updated successfully!');
                    window.location.href = `/evaluation/${evaluationId}`;
                } else {
                    const error = await response.json();
                    alert(`Failed to update evaluation: ${error.detail}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert(`Failed to update evaluation: ${error.message}`);
            }
        });
    </script>
</body>
</html>
