<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Run Replay - APEX-UX</title>
    <link rel="icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button onclick="goBack()" class="text-gray-600 hover:text-gray-900">
                        ← Back to Report
                    </button>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900" id="task-title">Task Replay</h1>
                        <p class="text-sm text-gray-600" id="task-subtitle"></p>
                    </div>
                </div>
                <span id="status-badge"></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-gray-600">Loading task run...</p>
        </div>

        <!-- Replay Content -->
        <div id="replay-content" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column: Screenshot + Controls (2/3 width) -->
                <div class="lg:col-span-2 space-y-4">
                    <!-- Screenshot -->
                    <div class="bg-white shadow rounded-lg p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-semibold text-gray-900">Screenshot</h2>
                            <span class="text-sm text-gray-600" id="step-indicator">Step 1 / 1</span>
                        </div>
                        
                        <div class="relative border border-gray-200 rounded overflow-hidden bg-gray-100">
                            <canvas id="screenshot-canvas" class="w-full h-auto"></canvas>
                            <div id="screenshot-loading" class="absolute inset-0 flex items-center justify-center bg-gray-100">
                                <div class="text-center">
                                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                                    <p class="mt-2 text-sm text-gray-600">Loading screenshot...</p>
                                </div>
                            </div>
                        </div>

                        <!-- Navigation Controls -->
                        <div class="flex justify-between items-center mt-4">
                            <button id="btn-prev" onclick="previousStep()" 
                                    class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                                ← Previous
                            </button>
                            
                            <div class="text-sm text-gray-600">
                                Use ← → arrow keys to navigate
                            </div>
                            
                            <button id="btn-next" onclick="nextStep()" 
                                    class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                                Next →
                            </button>
                        </div>
                    </div>

                    <!-- Action Details -->
                    <div class="bg-white shadow rounded-lg p-6">
                        <h2 class="text-lg font-semibold text-gray-900 mb-4">📝 Action Details</h2>
                        <div id="action-details" class="space-y-3">
                            <!-- Action details will be inserted here -->
                        </div>
                    </div>
                </div>

                <!-- Right Column: Timeline + Metrics (1/3 width) -->
                <div class="space-y-4">
                    <!-- Task Metrics -->
                    <div class="bg-white shadow rounded-lg p-6">
                        <h2 class="text-lg font-semibold text-gray-900 mb-4">📊 Metrics</h2>
                        <div id="metrics-display" class="space-y-2 text-sm">
                            <!-- Metrics will be inserted here -->
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div class="bg-white shadow rounded-lg p-6">
                        <h2 class="text-lg font-semibold text-gray-900 mb-4">📸 Timeline</h2>
                        <div id="timeline" class="space-y-2">
                            <!-- Timeline steps will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '';

        // Get task run ID from URL
        const taskRunId = window.location.pathname.split('/')[2];

        // State
        let taskRunData = null;
        let currentStepIndex = 0;
        let evaluationId = null;

        // Load task run on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTaskRun();
            setupKeyboardNavigation();
        });

        async function loadTaskRun() {
            try {
                const response = await fetch(`${API_BASE}/api/task-run/${taskRunId}`);
                taskRunData = await response.json();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('replay-content').classList.remove('hidden');

                renderTaskRun();
                showStep(0);
            } catch (error) {
                console.error('Failed to load task run:', error);
                document.getElementById('loading').innerHTML = `
                    <p class="text-red-600">Failed to load task run. Please refresh the page.</p>
                `;
            }
        }

        function renderTaskRun() {
            // Header
            document.getElementById('task-title').textContent = `Task: ${taskRunData.task_description}`;
            document.getElementById('task-subtitle').textContent = 
                `Persona: ${taskRunData.clone_id} | ${taskRunData.actions.length} steps`;
            document.getElementById('status-badge').innerHTML = getStatusBadge(taskRunData.status);

            // Metrics
            const metricsHtml = [];
            if (taskRunData.metrics) {
                metricsHtml.push(`<div><strong>Steps:</strong> ${taskRunData.metrics.steps_taken}</div>`);
                metricsHtml.push(`<div><strong>Failed Actions:</strong> ${taskRunData.metrics.failed_action_count}</div>`);
                metricsHtml.push(`<div><strong>Outcome Mismatches:</strong> ${taskRunData.metrics.outcome_mismatch_count}</div>`);
                metricsHtml.push(`<div><strong>Backtracking:</strong> ${taskRunData.metrics.backtracking_count}</div>`);
                if (taskRunData.metrics.seq_score) {
                    metricsHtml.push(`<div><strong>SEQ Score:</strong> ${taskRunData.metrics.seq_score.toFixed(1)}/7</div>`);
                }
            }
            if (taskRunData.verification_result) {
                metricsHtml.push(`<div><strong>Verification:</strong> ${taskRunData.verification_result}</div>`);
            }
            document.getElementById('metrics-display').innerHTML = metricsHtml.join('');

            // Timeline
            renderTimeline();
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            taskRunData.actions.forEach((action, index) => {
                const step = document.createElement('div');
                step.className = `cursor-pointer p-2 rounded ${index === currentStepIndex ? 'bg-blue-100 border-2 border-blue-500' : 'hover:bg-gray-100'}`;
                step.onclick = () => showStep(index);

                const statusIcon = action.execution_success ? '✓' : '⚠';
                const statusColor = action.execution_success ? 'text-green-600' : 'text-red-600';

                step.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-medium text-gray-500">${action.step_number}</span>
                        <span class="${statusColor}">${statusIcon}</span>
                        <span class="text-xs font-medium flex-1">${action.action_type}</span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1 truncate">
                        ${action.reasoning || ''}
                    </div>
                `;

                timeline.appendChild(step);
            });
        }

        async function showStep(index) {
            if (index < 0 || index >= taskRunData.actions.length) return;

            currentStepIndex = index;
            const action = taskRunData.actions[index];

            // Update step indicator
            document.getElementById('step-indicator').textContent = 
                `Step ${action.step_number} / ${taskRunData.actions.length}`;

            // Update navigation buttons
            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === taskRunData.actions.length - 1;

            // Update action details
            renderActionDetails(action);

            // Update timeline highlighting
            renderTimeline();

            // Load and display screenshot
            await loadScreenshot(action.screenshot_url, action.bounding_box, action.click_coordinates);
        }

        function renderActionDetails(action) {
            const statusBadge = action.execution_success 
                ? '<span class="px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-800">✓ Success</span>'
                : '<span class="px-2 py-1 text-xs font-medium rounded-full bg-red-100 text-red-800">✗ Failed</span>';

            const details = [];
            details.push(`<div><strong>Type:</strong> ${action.action_type}</div>`);
            
            if (action.target_description) {
                details.push(`<div><strong>Target:</strong> ${action.target_description}</div>`);
            }
            
            if (action.input_value) {
                details.push(`<div><strong>Input:</strong> ${action.input_value}</div>`);
            }
            
            if (action.reasoning) {
                details.push(`<div><strong>Reasoning:</strong> ${action.reasoning}</div>`);
            }
            
            details.push(`<div><strong>Execution:</strong> ${statusBadge}</div>`);
            
            if (action.execution_feedback) {
                details.push(`<div class="text-sm text-gray-600 mt-2">${action.execution_feedback}</div>`);
            }

            document.getElementById('action-details').innerHTML = details.join('');
        }

        async function loadScreenshot(screenshotUrl, boundingBox, clickCoordinates) {
            if (!screenshotUrl) {
                document.getElementById('screenshot-loading').innerHTML = 
                    '<p class="text-gray-500">No screenshot available</p>';
                return;
            }

            document.getElementById('screenshot-loading').classList.remove('hidden');

            try {
                // Fetch screenshot as base64
                const response = await fetch(`${API_BASE}/api/screenshot?url=${encodeURIComponent(screenshotUrl)}`);
                const data = await response.json();

                // Draw screenshot with overlay
                drawScreenshot(data.data, boundingBox, clickCoordinates);

                document.getElementById('screenshot-loading').classList.add('hidden');
            } catch (error) {
                console.error('Failed to load screenshot:', error);
                document.getElementById('screenshot-loading').innerHTML = 
                    '<p class="text-red-500">Failed to load screenshot</p>';
            }
        }

        function drawScreenshot(base64Data, boundingBox, clickCoordinates) {
            const canvas = document.getElementById('screenshot-canvas');
            const ctx = canvas.getContext('2d');

            const image = new Image();
            image.onload = () => {
                // Set canvas size to match image
                canvas.width = image.width;
                canvas.height = image.height;

                // Draw screenshot
                ctx.drawImage(image, 0, 0);

                // Draw bounding box (cyan/teal dashed rectangle with transparency)
                if (boundingBox) {
                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.8)'; // cyan-500 with 80% opacity
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 4]); // Dashed line: 8px dash, 4px gap
                    ctx.strokeRect(
                        boundingBox.x1,
                        boundingBox.y1,
                        boundingBox.x2 - boundingBox.x1,
                        boundingBox.y2 - boundingBox.y1
                    );
                    ctx.setLineDash([]); // Reset to solid for other drawings
                }

                // Draw click point (pointer finger emoji)
                if (clickCoordinates) {
                    const emoji = '👆';
                    ctx.font = '24px Arial'; // Small size
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Add shadow for visibility
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    
                    // Draw emoji at click point
                    ctx.fillText(emoji, clickCoordinates.x, clickCoordinates.y + 18); // Offset up slightly so finger points at spot
                    
                    // Reset shadow
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                }
            };

            image.src = `data:image/png;base64,${base64Data}`;
        }

        function previousStep() {
            showStep(currentStepIndex - 1);
        }

        function nextStep() {
            showStep(currentStepIndex + 1);
        }

        function setupKeyboardNavigation() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    previousStep();
                } else if (e.key === 'ArrowRight') {
                    nextStep();
                }
            });
        }

        function getStatusBadge(status) {
            const badges = {
                'VERIFIED': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-800">✓ Verified</span>',
                'FAILED': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-red-100 text-red-800">✗ Failed</span>',
                'TIMEOUT': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-yellow-100 text-yellow-800">⏱ Timeout</span>',
                'RUNNING': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-800">⏳ Running</span>',
                'PENDING': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-800">○ Pending</span>'
            };
            return badges[status] || '';
        }

        function goBack() {
            // Try to extract evaluation ID from task run data or go to home
            window.history.back();
        }
    </script>
</body>
</html>
