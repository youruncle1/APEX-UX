<!-- SUS Modal (shared partial) -->
<div id="sus-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
    <div class="flex items-center justify-center min-h-screen p-4" onclick="closeSUSModal()">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl" onclick="event.stopPropagation()">
            <!-- fixed header -->
            <div class="bg-brand-navy text-white px-6 py-4 flex justify-between items-center rounded-t-lg flex-shrink-0">
                <div>
                    <h2 class="text-2xl font-bold">System Usability Scale (SUS)</h2>
                    <p class="text-sm mt-1" style="color:rgba(255,255,255,0.6)" id="sus-persona-name">-</p>
                </div>
                <button onclick="closeSUSModal()" class="text-white hover:text-gray-200 text-3xl leading-none">&times;</button>
            </div>
            <!-- fixed score bar -->
            <div class="px-6 py-3 border-b border-border-gray flex items-center gap-5 flex-shrink-0 bg-page-gray">
                <div class="w-20 h-20 rounded-full bg-white shadow-md flex flex-col items-center justify-center border border-border-gray flex-shrink-0">
                    <div class="text-2xl font-bold text-brand-blue" id="sus-score">-</div>
                    <div class="text-xs text-muted-gray">/100</div>
                </div>
                <div class="flex-1">
                    <div class="text-xs font-medium text-muted-gray mb-1">Interpretation</div>
                    <div id="sus-badge" class="inline-block px-3 py-1 rounded-full text-sm font-semibold"></div>
                    <div class="mt-1 text-xs text-muted-gray">Based on 10 standardized usability questions</div>
                </div>
            </div>
            <!-- scrollable body -->
            <div class="overflow-y-auto flex-1">
                <div class="px-6 pt-3 pb-2" id="sus-questions"></div>
                <div class="px-6 py-3 border-t border-border-gray bg-page-gray">
                    <h3 class="text-sm font-semibold text-brand-navy mb-1.5">Agent's Overall Impression</h3>
                    <div class="rounded-lg px-4 py-2.5 text-sm text-body-dark border-l-4 border-brand-blue bg-white" id="sus-reason"></div>
                </div>
            </div>
            <!-- fixed footer -->
            <div class="px-6 py-3 flex justify-end border-t border-border-gray rounded-b-lg bg-page-gray flex-shrink-0">
                <button onclick="closeSUSModal()" class="px-4 py-2 text-sm font-medium border rounded border-brand-navy text-brand-navy bg-transparent hover:opacity-80 transition-opacity">Close</button>
            </div>
        </div>
    </div>
</div>
