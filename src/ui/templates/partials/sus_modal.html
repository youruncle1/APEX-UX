<!-- SUS Modal (shared partial) -->
<div id="sus-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen p-4" onclick="closeSUSModal()">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
            <div class="text-white px-6 py-4 flex justify-between items-center" style="background:linear-gradient(to right,#090947,#0A66FF)">
                <div>
                    <h2 class="text-2xl font-bold">System Usability Scale (SUS)</h2>
                    <p class="text-sm opacity-90 mt-1" id="sus-persona-name">-</p>
                </div>
                <button onclick="closeSUSModal()" class="text-white hover:text-gray-200 text-3xl leading-none">&times;</button>
            </div>
            <div class="overflow-y-auto max-h-[calc(90vh-140px)]">
                <div class="px-6 py-6 border-b border-border-gray" style="background:linear-gradient(to right,rgba(9,9,71,0.05),rgba(10,102,255,0.05))">
                    <div class="flex items-center gap-6">
                        <div class="w-24 h-24 rounded-full bg-white shadow-lg flex flex-col items-center justify-center border border-border-gray">
                            <div class="text-3xl font-bold text-brand-blue" id="sus-score">-</div>
                            <div class="text-xs text-muted-gray">/100</div>
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-medium text-muted-gray mb-2">Interpretation</div>
                            <div id="sus-badge" class="inline-block px-4 py-2 rounded-full text-sm font-semibold"></div>
                            <div class="mt-3 text-sm text-muted-gray">Based on 10 standardized usability questions</div>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4" id="sus-questions"></div>
                <div class="px-6 py-4 border-t border-border-gray" class="bg-page-gray">
                    <h3 class="font-semibold text-brand-navy mb-2">Agent's Overall Impression</h3>
                    <div class="bg-white rounded-lg p-4 text-sm text-body-dark border-l-4 border-brand-blue" id="sus-reason"></div>
                </div>
            </div>
            <div class="px-6 py-3 flex justify-end border-t border-border-gray" class="bg-page-gray">
                <button onclick="closeSUSModal()" class="px-4 py-2 text-sm font-medium border rounded border-brand-navy text-brand-navy bg-transparent hover:opacity-80 transition-opacity">Close</button>
            </div>
        </div>
    </div>
</div>
